name: Issue Manager
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily
  issue_comment:
    types:
      - created
      - edited

permissions:
  issues: write
  pull-requests: write

jobs:
  issue-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: tiangolo/issue-manager@v0.5.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: |
            {
              "answered": {
                "delay": 864000,
                "message": "Assuming the original issue was solved, it will be automatically closed now. But feel free to add more comments or create new issues."
              }
            }
